<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a1a2e">
    <title>我和TA的对话</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <!-- ========== 顶部导航栏 ========== -->
        <header class="chat-header" id="chatHeader">
            <div class="header-left">
                <button class="icon-btn" id="settingsBtn" title="设置">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </svg>
                </button>
            </div>
            <div class="header-center" id="headerCenter">
                <div class="ta-name" id="taName">TA</div>
                <div class="ta-status" id="taStatus">在线</div>
            </div>
            <div class="header-right">
                <button class="icon-btn" id="cardMgrBtn" title="字卡管理">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                        <line x1="3" y1="9" x2="21" y2="9"/>
                        <line x1="9" y1="21" x2="9" y2="9"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- ========== 聊天消息区域 ========== -->
        <main class="chat-body" id="chatBody">
            <div class="chat-messages" id="chatMessages">
                <!-- 消息将由 JS 动态渲染 -->
            </div>
        </main>

        <!-- ========== 底部输入区 + 表情面板 ========== -->
        <div class="chat-bottom-area" id="chatBottomArea">
            <footer class="chat-footer" id="chatFooter">
                <div class="input-wrapper">
                    <button class="icon-btn emoji-btn" id="emojiBtn" title="表情">
                        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"/>
                            <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
                            <line x1="9" y1="9" x2="9.01" y2="9"/>
                            <line x1="15" y1="9" x2="15.01" y2="9"/>
                        </svg>
                    </button>
                    <textarea class="message-input" id="messageInput" placeholder="说点什么..." rows="1"></textarea>
                    <button class="send-btn" id="sendBtn" title="发送">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"/>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                        </svg>
                    </button>
                </div>
            </footer>

            <!-- ========== 表情面板 ========== -->
            <div class="emoji-panel" id="emojiPanel">
                <div class="emoji-tabs">
                    <button class="emoji-tab active" data-tab="default">表情</button>
                    <button class="emoji-tab" data-tab="custom">自定义</button>
                </div>
                <div class="emoji-tab-content" id="emojiTabDefault">
                    <div class="emoji-grid" id="emojiGrid"></div>
                </div>
                <div class="emoji-tab-content" id="emojiTabCustom" style="display:none;">
                    <div class="custom-emoji-actions">
                        <button class="btn-mini" id="addImageEmojiBtn">+ 图片表情</button>
                    </div>
                    <div class="emoji-grid" id="customEmojiGrid"></div>
                </div>
            </div>
        </div>

        <!-- ========== 字卡管理面板（抽屉） ========== -->
        <div class="drawer-overlay" id="cardOverlay"></div>
        <aside class="drawer card-drawer" id="cardDrawer">
            <div class="drawer-header">
                <h2>TA的字卡库</h2>
                <button class="icon-btn close-btn" id="closeCardBtn">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="drawer-body">
                <div class="card-stats" id="cardStats">
                    <div class="stat-item">
                        <span class="stat-num" id="totalCards">0</span>
                        <span class="stat-label">字卡总数</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-num" id="totalMessages">0</span>
                        <span class="stat-label">消息总数</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-num" id="totalDays">0</span>
                        <span class="stat-label">对话天数</span>
                    </div>
                </div>
                <div class="card-add-area">
                    <textarea class="card-input" id="cardInput" placeholder="输入字卡内容，每行一张字卡..." rows="3"></textarea>
                    <div class="card-add-row">
                        <select class="setting-input card-group-select" id="cardGroupSelect">
                            <option value="default">默认分组</option>
                        </select>
                        <button class="btn-primary" id="addCardBtn">添加到字卡库</button>
                    </div>
                </div>
                <div class="card-group-bar">
                    <div class="card-group-tabs" id="cardGroupTabs">
                        <button class="group-tab active" data-group="all">全部</button>
                        <button class="group-tab" data-group="default">默认</button>
                    </div>
                    <button class="btn-mini" id="addGroupBtn">+ 新建分组</button>
                </div>
                <div class="card-group-manage" id="cardGroupManage" style="display:none;">
                    <button class="btn-mini" id="renameGroupBtn">重命名</button>
                    <button class="btn-mini btn-mini-danger" id="deleteGroupBtn">删除分组</button>
                    <button class="btn-mini" id="exitGroupManageBtn">完成</button>
                </div>
                <div class="card-toolbar">
                    <input type="text" class="search-input" id="cardSearch" placeholder="搜索字卡...">
                    <button class="btn-mini" id="batchModeBtn">批量管理</button>
                </div>
                <div class="batch-actions" id="batchActions" style="display:none;">
                    <button class="btn-mini" id="selectAllBtn">全选</button>
                    <button class="btn-mini" id="deselectAllBtn">取消全选</button>
                    <span class="batch-count" id="batchCount">已选 0 张</span>
                    <button class="btn-mini btn-mini-danger" id="batchDeleteBtn">删除选中</button>
                    <button class="btn-mini" id="exitBatchBtn">退出</button>
                </div>
                <div class="card-list" id="cardList">
                    <!-- 字卡列表由 JS 动态渲染 -->
                </div>
            </div>
        </aside>

        <!-- ========== 设置面板（抽屉） ========== -->
        <div class="drawer-overlay" id="settingsOverlay"></div>
        <aside class="drawer settings-drawer" id="settingsDrawer">
            <div class="drawer-header">
                <h2>设置</h2>
                <button class="icon-btn close-btn" id="closeSettingsBtn">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="drawer-body">
                <div class="settings-group">
                    <h3 class="settings-title">个人信息</h3>
                    <div class="setting-row">
                        <label>我的名字</label>
                        <input type="text" class="setting-input" id="userNameInput" placeholder="我">
                    </div>
                    <div class="setting-row avatar-setting-row">
                        <label>我的头像</label>
                        <div class="avatar-setting-right">
                            <div class="avatar-preview" id="userAvatarPreview"></div>
                            <input type="text" class="setting-input avatar-text-input" id="userAvatarInput" placeholder="文字" maxlength="2">
                            <button class="btn-mini avatar-upload-btn" id="userAvatarUploadBtn">上传图片</button>
                            <button class="btn-mini avatar-clear-btn" id="userAvatarClearBtn" style="display:none;">清除图片</button>
                        </div>
                    </div>
                    <div class="setting-row">
                        <label>TA的名字</label>
                        <input type="text" class="setting-input" id="taNameInput" placeholder="TA">
                    </div>
                    <div class="setting-row avatar-setting-row">
                        <label>TA的头像</label>
                        <div class="avatar-setting-right">
                            <div class="avatar-preview" id="taAvatarPreview"></div>
                            <input type="text" class="setting-input avatar-text-input" id="taAvatarInput" placeholder="文字" maxlength="2">
                            <button class="btn-mini avatar-upload-btn" id="taAvatarUploadBtn">上传图片</button>
                            <button class="btn-mini avatar-clear-btn" id="taAvatarClearBtn" style="display:none;">清除图片</button>
                        </div>
                    </div>
                </div>
                <div class="settings-group">
                    <h3 class="settings-title">对话体验</h3>
                    <div class="setting-row">
                        <label>TA回复延迟(秒)</label>
                        <input type="text" class="setting-input" id="typingDelayInput" inputmode="decimal" placeholder="0.8" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
                    </div>
                    <div class="setting-row">
                        <label>显示打字动画</label>
                        <label class="switch">
                            <input type="checkbox" id="typingAnimToggle">
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="setting-row">
                        <label>显示时间戳</label>
                        <label class="switch">
                            <input type="checkbox" id="showTimeToggle">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
                <div class="settings-group">
                    <h3 class="settings-title">外观</h3>
                    <div class="setting-row">
                        <label>主题颜色</label>
                        <div class="theme-picker" id="themePicker">
                            <button class="theme-dot active" data-theme="warm" style="--dot:#e8917a"></button>
                            <button class="theme-dot" data-theme="cool" style="--dot:#6aa9e2"></button>
                            <button class="theme-dot" data-theme="purple" style="--dot:#a87ad4"></button>
                            <button class="theme-dot" data-theme="green" style="--dot:#7ad4a0"></button>
                            <button class="theme-dot" data-theme="dark" style="--dot:#4a4a5a"></button>
                        </div>
                    </div>
                    <div class="setting-row">
                        <label>聊天背景</label>
                        <select class="setting-input setting-select" id="bgSelect">
                            <option value="default">默认渐变</option>
                            <option value="pure">纯色深色</option>
                            <option value="warm-bg">暖色氛围</option>
                            <option value="cool-bg">冷色氛围</option>
                            <option value="night">深夜模式</option>
                            <option value="white">纯白</option>
                            <option value="paper">米白纸感</option>
                        </select>
                    </div>
                </div>
                <div class="settings-group">
                    <h3 class="settings-title">数据管理</h3>
                    <button class="btn-secondary" id="exportBtn">导出聊天记录</button>
                    <button class="btn-secondary" id="importBtn">导入聊天记录</button>
                    <button class="btn-danger" id="clearChatBtn">清空聊天记录</button>
                    <button class="btn-danger" id="resetBtn">重置全部数据</button>
                </div>
                <div class="settings-group about-section">
                    <p class="about-text">这是一个私人字卡聊天空间。<br>TA的每一条回复都来自你亲手创建的字卡库。<br>每一次对话，都是一次温柔的随机相遇。</p>
                </div>
            </div>
        </aside>

        <!-- ========== Toast 提示 ========== -->
        <div class="toast" id="toast"></div>

        <!-- ========== 确认弹窗 ========== -->
        <div class="modal-overlay" id="modalOverlay">
            <div class="modal">
                <p class="modal-text" id="modalText"></p>
                <div class="modal-actions">
                    <button class="btn-secondary" id="modalCancel">取消</button>
                    <button class="btn-danger" id="modalConfirm">确认</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ========== JS 模块 ========== -->
    <script src="js/eventbus.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/cards.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
